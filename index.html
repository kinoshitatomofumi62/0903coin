    // --- COLOR NOTE OPTIONS ---
    const COIN_COLOR_OPTIONS = [
      { key: 'real', label: '本物 (安全)', shortLabel: '本物', badge: '🟢 本物', textColor: 'text-emerald-800', bgClass: 'bg-emerald-50 hover:bg-emerald-100', borderClass: 'border-emerald-300', dotClass: 'bg-emerald-500' },
      { key: 'heavy', label: '重い疑い', shortLabel: '重い?', badge: '🔺 重い', textColor: 'text-rose-800', bgClass: 'bg-rose-50 hover:bg-rose-100', borderClass: 'border-rose-300', dotClass: 'bg-rose-500' },
      { key: 'light', label: '軽い疑い', shortLabel: '軽い?', badge: '🔻 軽い', textColor: 'text-sky-800', bgClass: 'bg-sky-50 hover:bg-sky-100', borderClass: 'border-sky-300', dotClass: 'bg-sky-500' },
      { key: 'suspect', label: '注目グループ', shortLabel: '注目', badge: '🟣 注目', textColor: 'text-purple-800', bgClass: 'bg-purple-50 hover:bg-purple-100', borderClass: 'border-purple-300', dotClass: 'bg-purple-500' },
      { key: 'gray', label: '除外', shortLabel: '除外', badge: '⚪ 除外', textColor: 'text-slate-600', bgClass: 'bg-slate-100 hover:bg-slate-200', borderClass: 'border-slate-300', dotClass: 'bg-slate-400' },
      { key: 'default', label: '通常 (消しゴム)', shortLabel: '通常', badge: '🟡 通常', textColor: 'text-amber-900', bgClass: 'bg-amber-50/60 hover:bg-amber-100/80', borderClass: 'border-amber-200', dotClass: 'bg-amber-400' },
    ];

    const generateRandomSecret = (count = 12) => ({
      id: Math.floor(Math.random() * count) + 1,
      type: Math.random() < 0.5 ? 'heavy' : 'light',
    });

    const DROP_ZONE_IDS = {
      left: 'scale-left-pan',
      right: 'scale-right-pan',
      bench: 'bench-coins-container',
    };

    function clearTouchOverHighlights() {
      document.querySelectorAll('[data-touch-over]').forEach((el) => {
        el.removeAttribute('data-touch-over');
      });
    }

    function setTouchOverHighlight(zone) {
      clearTouchOverHighlights();
      if (!zone) return;
      const targetEl = document.getElementById(DROP_ZONE_IDS[zone]);
      if (targetEl) {
        targetEl.setAttribute('data-touch-over', 'true');
      }
    }

    function detectDropZone(clientX, clientY) {
      const el = document.elementFromPoint(clientX, clientY);
      const directZone = el && el.closest('[data-drop-zone]') ? el.closest('[data-drop-zone]').getAttribute('data-drop-zone') : null;
      if (directZone === 'left' || directZone === 'right' || directZone === 'bench') {
        return directZone;
      }

      const MARGIN = 32;
      let bestZone = null;
      let bestDist = Infinity;
      ['left', 'right', 'bench'].forEach((zoneKey) => {
        const dom = document.getElementById(DROP_ZONE_IDS[zoneKey]);
        if (!dom) return;
        const rect = dom.getBoundingClientRect();
        if (
          clientX >= rect.left - MARGIN &&
          clientX <= rect.right + MARGIN &&
          clientY >= rect.top - MARGIN &&
          clientY <= rect.bottom + MARGIN
        ) {
          const cx = (rect.left + rect.right) / 2;
          const cy = (rect.top + rect.bottom) / 2;
          const dist = Math.hypot(clientX - cx, clientY - cy);
          if (dist < bestDist) {
            bestDist = dist;
            bestZone = zoneKey;
          }
        }
      });
      return bestZone;
    }

    // --- COIN COMPONENT ---
    function CoinItem({ id, colorTag = 'default', onClick, onMove, onDragStart }) {
      const coinRef = useRef(null);
      const onMoveRef = useRef(onMove);
      onMoveRef.current = onMove;

      const touchStateRef = useRef({
        active: false,
        isDragging: false,
        startX: 0,
        startY: 0,
        x: 0,
        y: 0,
        zone: null,
        lastDragEndTime: 0,
      });

      const [touchDragPreview, setTouchDragPreview] = useState(null);

      const colorInfo = useMemo(() => {
        const found = COIN_COLOR_OPTIONS.find((c) => c.key === colorTag);
        return found || COIN_COLOR_OPTIONS[5];
      }, [colorTag]);

      useEffect(() => {
        const el = coinRef.current;
        if (!el) return;

        const handleTouchStart = (e) => {
          if (e.touches.length !== 1) return;
          const touch = e.touches[0];
          touchStateRef.current.active = true;
          touchStateRef.current.isDragging = false;
          touchStateRef.current.startX = touch.clientX;
          touchStateRef.current.startY = touch.clientY;
          touchStateRef.current.x = touch.clientX;
          touchStateRef.current.y = touch.clientY;
          touchStateRef.current.zone = null;
        };

        const handleTouchMove = (e) => {
          const state = touchStateRef.current;
          if (!state.active || e.touches.length === 0) return;
          const touch = e.touches[0];
          const dx = touch.clientX - state.startX;
          const dy = touch.clientY - state.startY;

          if (!state.isDragging && Math.hypot(dx, dy) > 6) {
            state.isDragging = true;
          }

          if (state.isDragging) {
            if (e.cancelable) e.preventDefault();
            const zone = detectDropZone(touch.clientX, touch.clientY);
            state.x = touch.clientX;
            state.y = touch.clientY;
            state.zone = zone;
            setTouchOverHighlight(zone);
            setTouchDragPreview({ x: touch.clientX, y: touch.clientY, zone });
          }
        };

        const handleTouchEndOrCancel = (e) => {
          const state = touchStateRef.current;
          if (!state.active) return;
          clearTouchOverHighlights();

          if (state.isDragging) {
            if (e.cancelable) e.preventDefault();
            state.lastDragEndTime = Date.now();
            const changedTouch = e.changedTouches && e.changedTouches[0];
            const finalX = changedTouch ? changedTouch.clientX : state.x;
            const finalY = changedTouch ? changedTouch.clientY : state.y;
            const targetZone = detectDropZone(finalX, finalY) || state.zone;

            state.active = false;
            state.isDragging = false;
            state.zone = null;
            setTouchDragPreview(null);

            if (targetZone && onMoveRef.current) {
              onMoveRef.current(id, targetZone);
            }
          } else {
            state.active = false;
            state.isDragging = false;
            state.zone = null;
            setTouchDragPreview(null);
          }
        };

        el.addEventListener('touchstart', handleTouchStart, { passive: true });
        el.addEventListener('touchmove', handleTouchMove, { passive: false });
        el.addEventListener('touchend', handleTouchEndOrCancel, { passive: false });
        el.addEventListener('touchcancel', handleTouchEndOrCancel, { passive: false });

        return () => {
          el.removeEventListener('touchstart', handleTouchStart);
          el.removeEventListener('touchmove', handleTouchMove);
          el.removeEventListener('touchend', handleTouchEndOrCancel);
          el.removeEventListener('touchcancel', handleTouchEndOrCancel);
          clearTouchOverHighlights();
        };
      }, [id]);

      const handleClickInternal = () => {
        if (Date.now() - touchStateRef.current.lastDragEndTime < 450) return;
        if (onClick) onClick();
      };

      return (
        <>
          <div
            ref={coinRef}
            draggable
            onDragStart={(e) => {
              if (touchStateRef.current.active) {
                e.preventDefault();
                return;
              }
              e.dataTransfer.setData('text/plain', JSON.stringify({ coinId: id }));
              if (onDragStart) onDragStart(id);
            }}
            onContextMenu={(e) => {
              if (touchStateRef.current.active) e.preventDefault();
            }}
            onClick={handleClickInternal}
            className={`
              draggable-coin
              relative w-8 h-8 sm:w-10 sm:h-10 rounded-full flex flex-col items-center justify-center cursor-grab active:cursor-grabbing select-none
              transition-all duration-200 shadow-sm active:scale-95 group shrink-0
              ${colorInfo.bgClass} border-2 ${colorInfo.borderClass}
              hover:scale-110 hover:shadow-md
              ${touchDragPreview ? 'opacity-40 scale-90' : 'opacity-100'}
            `}
            title={`コイン #${id} (${colorInfo.label}) - ドラッグまたはタップで移動`}
          >
            <div className="absolute inset-0.5 rounded-full border border-amber-300/40 pointer-events-none" />
            <span className="font-mono font-black text-xs sm:text-sm text-slate-800 drop-shadow-xs z-10 pointer-events-none">
              {id}
            </span>
            {colorTag && colorTag !== 'default' && (
              <span className={`absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full ${colorInfo.dotClass} border-2 border-white shadow-xs z-20 pointer-events-none`} />
            )}
          </div>
          {touchDragPreview &&
            ReactDOM.createPortal(
              <div
                style={{
                  position: 'fixed',
                  left: `${touchDragPreview.x}px`,
                  top: `${touchDragPreview.y - 24}px`,
                  transform: 'translate(-50%, -50%)',
                  zIndex: 9999,
                  pointerEvents: 'none',
                }}
                className="flex flex-col items-center gap-1"
              >
                <div
                  className={`px-2 py-0.5 rounded-full text-[10px] font-black whitespace-nowrap shadow-md border ${
                    touchDragPreview.zone === 'left' || touchDragPreview.zone === 'right'
                      ? 'bg-amber-500 text-slate-950 border-white'
                      : touchDragPreview.zone === 'bench'
                      ? 'bg-slate-800 text-white border-amber-300'
                      : 'bg-white/95 text-slate-700 border-amber-300'
                  }`}
                >
                  {touchDragPreview.zone === 'left' && '⬅️ 左皿へドロップ'}
                  {touchDragPreview.zone === 'right' && '➡️ 右皿へドロップ'}
                  {touchDragPreview.zone === 'bench' && '⬇️ 机の上へ戻す'}
                  {!touchDragPreview.zone && `コイン #${id} を移動中`}
                </div>
                <div
                  className={`
                    w-11 h-11 rounded-full flex items-center justify-center font-mono font-black text-sm text-slate-900
                    shadow-2xl border-2 scale-110
                    ${colorInfo.bgClass} ${colorInfo.borderClass}
                  `}
                >
                  <span>{id}</span>
                </div>
              </div>,
              document.body
            )}
        </>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [isOpeningOpen, setIsOpeningOpen] = useState(true);
      const [coinCount, setCoinCount] = useState(12); // 12 or 13
      const [secret, setSecret] = useState(() => generateRandomSecret(12));
      const [leftCoins, setLeftCoins] = useState([]);
      const [rightCoins, setRightCoins] = useState([]);
      const [currentOutcome, setCurrentOutcome] = useState('empty');
      const [records, setRecords] = useState([]);
      const [isWeighing, setIsWeighing] = useState(false);
      const [coinColors, setCoinColors] = useState({});
      const [activeBrush, setActiveBrush] = useState('real');
      const [activeMobileTab, setActiveMobileTab] = useState('scale');
      
      // Modals
      const [answerAttempts, setAnswerAttempts] = useState(0);
      const [isAnswerOpen, setIsAnswerOpen] = useState(false);
      const [isGiveUpOpen, setIsGiveUpOpen] = useState(false);
      const [isRulesOpen, setIsRulesOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [isCopied, setIsCopied] = useState(false);

      const allCoinIds = useMemo(() => {
        return Array.from({ length: coinCount }, (_, i) => i + 1);
      }, [coinCount]);

      const benchCoins = allCoinIds.filter(id => !leftCoins.includes(id) && !rightCoins.includes(id));

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const handleNewGame = (newCount) => {
        const countToUse = newCount !== undefined ? newCount : coinCount;
        setSecret(generateRandomSecret(countToUse));
        setLeftCoins([]);
        setRightCoins([]);
        setCurrentOutcome('empty');
        setRecords([]);
        setCoinColors({});
        setIsWeighing(false);
        setAnswerAttempts(0);
        showToast(`新しい問題を設定しました！（${countToUse}枚モード）`);
      };

      const handleToggleCoinCount = (newCount) => {
        if (newCount === coinCount) return;
        setCoinCount(newCount);
        handleNewGame(newCount);
      };

      const handleRetrySame = () => {
        setLeftCoins([]);
        setRightCoins([]);
        setCurrentOutcome('empty');
        setRecords([]);
        setCoinColors({});
        setIsWeighing(false);
        setAnswerAttempts(0);
        showToast('同じ偽金設定のまま天秤をリセットしました。');
      };

      const handleMoveCoin = (id, target) => {
        setLeftCoins(prev => prev.filter(c => c !== id));
        setRightCoins(prev => prev.filter(c => c !== id));
        setCurrentOutcome('empty');

        if (target === 'left') {
          setLeftCoins(prev => {
            if (prev.length >= 6) {
              showToast('片方の皿には最大6枚までしか乗せられません');
              return prev;
            }
            return [...prev, id].sort((a, b) => a - b);
          });
        } else if (target === 'right') {
          setRightCoins(prev => {
            if (prev.length >= 6) {
              showToast('片方の皿には最大6枚までしか乗せられません');
              return prev;
            }
            return [...prev, id].sort((a, b) => a - b);
          });
        }
      };

      const handleWeigh = () => {
        if (leftCoins.length === 0 && rightCoins.length === 0) {
          showToast('天秤の皿にコインを乗せてから計量してください。');
          return;
        }

        setIsWeighing(true);
        setCurrentOutcome('empty');

        setTimeout(() => {
          let leftWeight = leftCoins.length * 10;
          let rightWeight = rightCoins.length * 10;

          if (leftCoins.includes(secret.id)) {
            leftWeight += (secret.type === 'heavy' ? 1 : -1);
          }
          if (rightCoins.includes(secret.id)) {
            rightWeight += (secret.type === 'heavy' ? 1 : -1);
          }

          let outcome = 'balanced';
          if (leftWeight > rightWeight) outcome = 'left_heavy';
          else if (rightWeight > leftWeight) outcome = 'right_heavy';

          setCurrentOutcome(outcome);
          setRecords(prev => [
            {
              step: prev.length + 1,
              leftCoins: [...leftCoins],
              rightCoins: [...rightCoins],
              outcome,
              timestamp: Date.now()
            },
            ...prev
          ]);
          setIsWeighing(false);
        }, 350);
      };

        if (currentOutcome === 'left_heavy') return -9;
        if (currentOutcome === 'right_heavy') return 9;
        return 0;
      }, [currentOutcome]);

      const handleCopyHTML = async () => {
        try {
          const htmlContent = document.documentElement.outerHTML;
          await navigator.clipboard.writeText(htmlContent);
          setIsCopied(true);
          showToast('HTMLコードをクリップボードにコピーしました！GitHubにそのまま貼り付けできます。');
          setTimeout(() => setIsCopied(false), 3000);

                <IconScale className="w-5 h-5" />
              </div>
              <div>
                <h1 className="text-sm sm:text-base font-black text-slate-900 flex items-center gap-1.5 group-hover:text-amber-900 transition-colors">
                  <span>✨ {coinCount}枚コインの偽金パズル</span>
                  <span className="text-[10px] bg-amber-100 text-amber-900 border border-amber-300 px-1.5 py-0.2 rounded font-mono font-bold">

                  </span>

                <p className="text-[10px] sm:text-xs text-amber-800 font-medium">

            </div>

            <div className="flex items-center gap-1 sm:gap-2">

                  type="button"
                  onClick={() => handleToggleCoinCount(9)}
                  className={`px-2 py-0.5 rounded transition-all ${
                    coinCount === 9
                      ? 'bg-amber-500 text-slate-950 shadow-xs'
                      : 'text-slate-600 hover:text-slate-900'

                  title="9枚バージョン（基礎・入門）"
                >
                  9枚(基礎)
                </button>
                <button
                  type="button"
                  onClick={() => handleToggleCoinCount(12)}
                  className={`px-2 py-0.5 rounded transition-all ${
                    coinCount === 12
                      ? 'bg-amber-500 text-slate-950 shadow-xs'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                  title="12枚バージョン（標準・本格）"
                >
                  12枚(標準)
                </button>
              </div>

              {/* Answer Button */}
              {answerAttempts > 0 && (
                <div className="hidden xs:flex items-center px-2 py-1 rounded-lg bg-rose-50 border border-rose-200 text-xs font-mono font-bold text-rose-700">

                </div>

              <button

              >
                <IconSparkles className="w-3.5 h-3.5" />
                <span>{answerAttempts === 0 ? '解答する' : `再解答 (${answerAttempts + 1}回目)`}</span>
              </button>

              {/* Give Up Button */}
              <button
                onClick={() => setIsGiveUpOpen(true)}
                className="px-2 sm:px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-800 font-bold text-xs flex items-center gap-1 transition-colors"

              >
                <IconFlag className="w-3.5 h-3.5 text-rose-600" />
                <span className="hidden sm:inline">ギブアップ</span>
              </button>

              {/* Rules Button */}
              <button
                onClick={() => setIsOpeningOpen(true)}
                className="p-1.5 sm:px-2.5 sm:py-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 border border-sky-200 text-sky-800 font-bold text-xs flex items-center gap-1"

                <IconHelpCircle className="w-3.5 h-3.5 text-sky-600" />
                <span className="hidden sm:inline">ルール</span>
              </button>

              <button

                          : 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                      }
                    `}
                  >
                    <IconScale className="w-4 h-4" />
                    <span>{isWeighing ? '計測中...' : '⚖️ 天秤で測る'}</span>
                  </button>
                </div>

                {/* Scale Visual Stage */}
                <div className="relative w-full max-w-xl mx-auto flex-1 flex flex-col justify-start items-center pt-3 sm:pt-4 pb-1 select-none overflow-hidden min-h-[160px] sm:min-h-[195px]">
                  {/* Continuous Central Stand / Pillar */}
                  <div className="absolute top-[14px] sm:top-[18px] bottom-0.5 flex flex-col items-center justify-between pointer-events-none z-0">
                    {/* Graduation Scale Dial Plate */}
                    <div className="relative flex flex-col items-center">
                      <div className="w-10 sm:w-12 h-5 sm:h-6 -mt-3 rounded-t-full bg-gradient-to-b from-amber-50 to-amber-100 border-2 border-amber-600 shadow-xs flex items-start justify-center pt-0.5">
                        <div className="flex items-center gap-1 text-[6px] text-amber-800 font-mono leading-none">
                          <span>╲</span>
                          <span className="text-rose-600 font-bold">｜</span>
                          <span>╱</span>
                        </div>
                      </div>
                    </div>

                    {/* Tall Turned Brass Pillar Shaft */}
                    <div className="w-3 sm:w-4 flex-1 bg-gradient-to-r from-amber-800 via-yellow-300 to-amber-800 border-x border-amber-900 shadow-md flex flex-col items-center justify-around py-2">
                      <div className="w-4 sm:w-5 h-1.5 rounded-full bg-gradient-to-r from-amber-900 via-yellow-200 to-amber-900 border border-amber-950 shadow-xs" />
                      <div className="w-3.5 sm:w-4.5 h-1 rounded-full bg-gradient-to-r from-amber-900 via-amber-300 to-amber-900" />
                    </div>

                    {/* Stepped Brass & Wood Pedestal Base */}
                    <div className="flex flex-col items-center">
                      <div className="w-12 sm:w-16 h-2 bg-gradient-to-r from-amber-800 via-yellow-400 to-amber-800 rounded-t-md border-t border-x border-amber-900" />
                      <div className="w-20 sm:w-28 h-3 sm:h-3.5 bg-gradient-to-r from-amber-950 via-amber-800 to-amber-950 rounded-t-lg rounded-b-sm border border-amber-950 shadow-md flex items-center justify-center">
                        <span className="text-[6px] sm:text-[7px] text-amber-200/90 font-mono tracking-widest font-bold">

                        </span>
                      </div>

                  {/* Central Fulcrum Jewel Point */}
                  <div className="absolute top-[16px] sm:top-[20px] w-4 sm:w-5 h-4 sm:h-5 rounded-full bg-gradient-to-br from-yellow-200 via-amber-500 to-amber-800 border-2 border-white shadow-md z-30 flex items-center justify-center pointer-events-none">
                    <div className="w-1.5 h-1.5 rounded-full bg-rose-600" />
                  </div>

                  {/* Rotating Lever Arm / Beam & Hanging Pans Assembly */}
                  <div
                    style={{
                      transform: `rotate(${beamAngle}deg)`,
                      transition: 'transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1)',
                      transformOrigin: '50% 10px'
                    }}
                    className="relative w-full max-w-[460px] sm:max-w-[520px] flex flex-col items-center z-20 pointer-events-none px-1 sm:px-2"
                  >
                    {/* Central Pointer Needle */}
                    <div className="absolute left-1/2 -top-3 sm:-top-3.5 -translate-x-1/2 w-1 h-4 sm:h-5 bg-gradient-to-t from-rose-700 via-rose-500 to-rose-400 rounded-t-full shadow-xs z-30" />

                    {/* Sculpted Top Horizontal Brass Balance Beam */}
                    <div className="relative w-[82%] sm:w-[80%] h-3 sm:h-3.5 bg-gradient-to-b from-yellow-200 via-amber-500 to-amber-800 rounded-full shadow-[0_3px_6px_rgba(120,53,15,0.35)] border border-amber-900 flex items-center justify-between px-1.5 sm:px-2 z-20">

                            data-drop-zone={side}
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={(e) => {

                            }}

                            <div className="mt-1 flex items-center justify-center gap-1 bg-white/90 backdrop-blur-xs px-2 py-0.5 rounded-full border border-amber-300/90 shadow-xs z-30">
                              <span className="text-[9px] sm:text-[10px] font-extrabold text-amber-950">
                                {side === 'left' ? '左皿' : '右皿'}
                              </span>
                              <span className={`font-mono text-[9px] sm:text-[10px] px-1 rounded font-bold ${coins.length > 0 ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'text-slate-500'}`}>
                                {coins.length}/6枚
                              </span>
                              {coins.length > 0 && (
                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    if (side === 'left') setLeftCoins([]);
                                    else setRightCoins([]);
                                    setCurrentOutcome('empty');
                                  }}
                                  className="ml-0.5 px-1 py-0.2 rounded-full bg-rose-50 hover:bg-rose-500 text-rose-700 hover:text-white border border-rose-200 text-[8px] sm:text-[9px] font-bold transition-colors flex items-center gap-0.5"
                                >
                                  <span>戻す</span>
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Outcome Badge */}
                <div className="w-full mt-1">
                  {currentOutcome !== 'empty' ? (
                    <div
                      className={`
                        w-full py-1.5 px-3 rounded-xl text-center font-bold text-xs sm:text-sm border shadow-xs flex items-center justify-center gap-1.5
                        ${
                          currentOutcome === 'balanced'
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-800'
                            : currentOutcome === 'left_heavy'
                            ? 'bg-amber-50 border-amber-300 text-amber-900'
                            : 'bg-sky-50 border-sky-300 text-sky-900'
                        }
                      `}
                    >
                      {currentOutcome === 'balanced' && <span>⚖️ 釣り合いました (＝ 両皿の重さは同じ)</span>}
                      {currentOutcome === 'left_heavy' && <span>🔻 左皿が重い (＞ 右皿より重い)</span>}
                      {currentOutcome === 'right_heavy' && <span>🔻 右皿が重い (＜ 左皿より重い)</span>}
                    </div>
                  ) : (
                    <div className="text-[11px] text-slate-500 py-1 text-center font-medium">
                      左右にコインを置き「⚖️ 天秤で測る」を押してください
                    </div>
                  )}
                </div>
              </div>

              {/* Bench Tray (Desk Coins) */}
              <div data-drop-zone="bench" className="bg-white/95 rounded-2xl border border-amber-200/90 p-2 sm:p-3 shadow-md shrink-0">
                <div className="flex items-center justify-between border-b border-amber-100 pb-1 mb-1">
                  <div className="flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-amber-500" />
                    <h3 className="font-bold text-slate-800 text-xs sm:text-sm">
                      机の上のコイン
                    </h3>
                    <span className="text-[10px] sm:text-[11px] font-mono font-semibold text-amber-800 bg-amber-50 px-1.5 py-0.2 rounded border border-amber-200">
                      残り {benchCoins.length} / {coinCount} 枚
                    </span>
                  </div>
                  <span className="text-[10px] text-slate-500 font-medium">
                    スマホ・PCドラッグ / タップ移動可
                  </span>
                </div>

                <div
                  id="bench-coins-container"
                  data-drop-zone="bench"
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => {
                    e.preventDefault();
                    try {
                      const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                      if (data.coinId) handleMoveCoin(data.coinId, 'bench');
                    } catch {}
                  }}
                  className="min-h-[46px] p-1.5 rounded-xl bg-amber-50/40 border border-amber-200/70 flex flex-wrap items-center justify-center gap-1.5 transition-all duration-150"
                >
                  {benchCoins.length === 0 ? (
                    <span className="text-xs text-slate-400 italic py-1">
                      すべてのコインが天秤の皿に乗っています
                    </span>
                  ) : (
                    benchCoins.map(id => (
                      <CoinItem
                        key={`bench-${id}`}
                        id={id}
                        colorTag={coinColors[id] || 'default'}
                        onMove={handleMoveCoin}
                        onClick={() => {
                          if (leftCoins.length < 6) {
                            handleMoveCoin(id, 'left');
                          } else if (rightCoins.length < 6) {
                            handleMoveCoin(id, 'right');
                          } else {
                            showToast('皿がいっぱいです');
                          }
                        }}
                      />
                    ))
                  )}
                </div>
              </div>
            </div>

            {/* Right Area: History & Color Memo (5 cols on lg) */}
            <div className={`lg:col-span-5 flex flex-col gap-2 sm:gap-3 min-h-0 ${activeMobileTab === 'notes' ? 'flex flex-1' : 'hidden lg:flex lg:h-full'}`}>
              
              {/* Color Memo Tool */}
              <div className="bg-white/95 rounded-2xl border border-amber-200/90 p-2 sm:p-3 shadow-md flex flex-col flex-1 min-h-0">
                <div className="flex items-center justify-between border-b border-amber-100 pb-1 mb-1 shrink-0">
                  <div className="flex items-center gap-1 text-slate-800 font-bold text-xs sm:text-sm">
                    <IconPalette className="w-3.5 h-3.5 text-amber-600" />
                    <span>コイン色分けメモ (推理マーク)</span>
                  </div>
                  <button
                    onClick={() => setCoinColors({})}
                    className="text-[10px] text-slate-500 hover:text-rose-600 font-medium px-1.5 py-0.5 rounded bg-slate-100 border border-slate-200"
                    title="色メモをクリア"
                  >
                    リセット
                  </button>
                </div>

                {/* Brush Selector */}
                <div className="grid grid-cols-3 sm:grid-cols-6 gap-1 mb-2 shrink-0">
                  {COIN_COLOR_OPTIONS.map(opt => (
                    <button
                      key={`brush-${opt.key}`}
                      onClick={() => setActiveBrush(opt.key)}
                      className={`
                        py-1 px-1 rounded-lg text-[10px] font-bold border transition-all flex items-center justify-center gap-0.5 shadow-xs
                        ${opt.bgClass} ${opt.textColor} ${opt.borderClass}
                        ${activeBrush === opt.key ? 'ring-2 ring-amber-500 scale-105 font-black' : 'opacity-80 hover:opacity-100'}
                      `}
                    >
                      <span className={`w-1.5 h-1.5 rounded-full ${opt.dotClass}`} />
                      <span>{opt.shortLabel}</span>
                    </button>
                  ))}
                </div>

                {/* Coins Note Grid (12 or 13 coins) */}
                <div className="grid grid-cols-4 sm:grid-cols-6 gap-1 sm:gap-1.5 overflow-y-auto pr-0.5 flex-1 min-h-0">
                  {allCoinIds.map(id => {
                    const tag = coinColors[id] || 'default';
                    const colorInfo = COIN_COLOR_OPTIONS.find(c => c.key === tag) || COIN_COLOR_OPTIONS[5];
                    return (
                      <button
                        key={`note-${id}`}
                        onClick={() => {
                          setCoinColors(prev => ({
                            ...prev,
                            [id]: prev[id] === activeBrush ? 'default' : activeBrush
                          }));
                        }}
                        className={`
                          p-1.5 rounded-xl border flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95
                          ${colorInfo.bgClass} ${colorInfo.borderClass}
                        `}
                        title={`コイン #${id} に「${activeBrush}」を適用/解除`}
                      >
                        <span className="font-mono font-black text-xs text-slate-900">
                          #{id}
                        </span>
                        <span className={`text-[9px] font-bold ${colorInfo.textColor} leading-none truncate max-w-[50px]`}>
                          {colorInfo.shortLabel}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Weighing History */}
              <div className="bg-white/95 rounded-2xl border border-amber-200/90 p-2 sm:p-3 shadow-md flex flex-col h-44 sm:h-52 shrink-0">
                <div className="flex items-center justify-between border-b border-amber-100 pb-1 mb-1 shrink-0">
                  <div className="flex items-center gap-1.5 font-bold text-slate-800 text-xs sm:text-sm">
                    <IconScale className="w-3.5 h-3.5 text-amber-600" />
                    <span>天秤計測の履歴</span>
                  </div>
                  <span className={`text-[10px] font-mono font-bold px-1.5 py-0.2 rounded border ${
                    records.length <= 3 ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-rose-50 text-rose-800 border-rose-300'
                  }`}>
                    {records.length} / 3 回
                  </span>
                </div>

                <div className="flex-1 overflow-y-auto space-y-1.5 pr-0.5 min-h-0">
                  {records.length === 0 ? (
                    <div className="h-full flex items-center justify-center text-xs text-slate-400 italic">
                      まだ天秤を使用していません（3回以内クリア目標）
                    </div>
                  ) : (
                    records.map((rec) => (
                      <div
                        key={`rec-${rec.step}`}
                        className="bg-amber-50/50 border border-amber-200/80 rounded-xl p-1.5 text-xs flex items-center justify-between gap-1 shadow-2xs"
                      >
                        <div className="flex items-center gap-1.5 min-w-0">
                          <span className="w-5 h-5 rounded-md bg-amber-200 text-amber-950 font-mono font-bold text-[10px] flex items-center justify-center shrink-0">
                            #{rec.step}
                          </span>
                          <div className="font-mono text-[11px] truncate">
                            <span className="text-slate-700 font-bold">[{rec.leftCoins.join(',')}]</span>
                            <span className="mx-1 font-bold text-amber-800">
                              {rec.outcome === 'balanced' ? '＝' : rec.outcome === 'left_heavy' ? '＞' : '＜'}
                            </span>
                            <span className="text-slate-700 font-bold">[{rec.rightCoins.join(',')}]</span>
                          </div>
                        </div>
                        <span className={`text-[10px] font-bold px-1.5 py-0.2 rounded shrink-0 ${
                          rec.outcome === 'balanced' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'
                        }`}>
                          {rec.outcome === 'balanced' ? '釣り合い' : rec.outcome === 'left_heavy' ? '左が重い' : '右が重い'}
                        </span>
                      </div>
                    ))
                  )}
                </div>
              </div>

            </div>
          </div>

          {/* Answer Modal */}
          {isAnswerOpen && (
            <AnswerModal
              isOpen={isAnswerOpen}
              onClose={() => setIsAnswerOpen(false)}
              secret={secret}
              records={records}
              coinCount={coinCount}
              answerAttempts={answerAttempts}
              onRecordAttempt={(correct) => {
                if (!correct) {
                  setAnswerAttempts(prev => prev + 1);
                }
              }}
              onNewGame={() => handleNewGame()}
              onOpenGiveUp={() => setIsGiveUpOpen(true)}
            />
          )}

          {/* Give Up Modal */}
          {isGiveUpOpen && (
            <GiveUpModal
              isOpen={isGiveUpOpen}
              onClose={() => setIsGiveUpOpen(false)}
              secret={secret}
              records={records}
              coinCount={coinCount}
              onRetrySameSecret={handleRetrySame}
              onNewGame={() => handleNewGame()}
            />
          )}

          {/* Rules Modal */}
          {isRulesOpen && (
            <RulesModal
              isOpen={isRulesOpen}
              onClose={() => setIsRulesOpen(false)}
              coinCount={coinCount}
            />
          )}

          {/* Opening Screen with Full Rules */}
          {isOpeningOpen && (
            <OpeningScreen
              onStartGame={() => setIsOpeningOpen(false)}
              hasActiveProgress={records.length > 0 || leftCoins.length > 0 || rightCoins.length > 0}
              coinCount={coinCount}
              onToggleCoinCount={handleToggleCoinCount}
              onNewGame={() => handleNewGame()}
            />
          )}
        </div>
      );
    }

    // --- TITLE & RANKING UTILITY ---
    function calculatePlayerRank(answerCount, weighingCount, coinCount = 12) {
      const isOptimalScale = weighingCount <= 3;
      if (answerCount <= 1) {
        if (isOptimalScale) {
          return {
            rank: 'SSS',
            title: coinCount === 9 ? '基礎マスター・論理の俊英' : '神域の論理神',
            desc: coinCount === 9
              ? '【解答1回＆天秤3回以内】誤答ゼロの一発正解！9枚基礎編を完璧に論理制覇した至高の称号！'
              : '【解答1回＆天秤3回以内】誤答ゼロの一発正解！完璧なる直観と数学論理を兼ね備えた至高の称号！',
            color: 'bg-amber-400 text-slate-950 border-amber-300',
            stars: 5,
          };
        } else if (weighingCount <= 5) {
          return {
            rank: 'SS',
            title: '一撃必中の一級鑑定士',
            desc: '【解答1回で一発正解】確実な計測の末、迷うことなく一度の解答で偽金の正体を射抜きました！',
            color: 'bg-purple-500 text-white border-purple-300',
            stars: 5,
          };
        } else {
          return {
            rank: 'S+',
            title: '百発百中の論理探偵',
            desc: '【解答1回で一発正解】データを盤石に揃え、一度のミスもなく1回目で確実に正解を特定！',
            color: 'bg-indigo-600 text-white border-indigo-400',
            stars: 4,
          };
        }
      }
      if (answerCount === 2) {
        if (isOptimalScale) {
          return {
            rank: 'S',
            title: '俊敏なる再考の賢者',
            desc: '【解答2回＆天秤3回以内】わずか1回のミスから素早く推論を立て直し、3回の天秤内で正解に到達！',
            color: 'bg-emerald-500 text-white border-emerald-300',
            stars: 4,
          };
        } else {
          return {
            rank: 'A+',
            title: '堅実なる推理捜査官',
            desc: '【解答2回】初回のズレを冷静に分析し、2回目の解答でしっかりと正解を突き止めました！',
            color: 'bg-teal-600 text-white border-teal-300',
            stars: 4,
          };
        }
      }
      if (answerCount === 3) {
        if (isOptimalScale) {
          return {
            rank: 'A',
            title: '粘り強き天秤の挑戦者',
            desc: '【解答3回】複数の可能性を粘り強く照合し、3回目の解答で真実に辿り着きました！',
            color: 'bg-blue-600 text-white border-blue-300',
            stars: 3,
          };
        } else {
          return {
            rank: 'B+',
            title: '不屈の論理学者',
            desc: '【解答3回】仮説の修正を重ね、見事に偽金とその重さの特定を完了しました！',
            color: 'bg-sky-600 text-white border-sky-300',
            stars: 3,
          };
        }
      }
      if (answerCount <= 5) {
        return {
          rank: 'B',
          title: '探究熱心な鑑定見習い',
          desc: `【解答${answerCount}回】試行錯誤を恐れず、最後まで考え抜いて偽金の特定に成功しました！`,
          color: 'bg-amber-600 text-white border-amber-400',
          stars: 2,
        };
      }
      return {
        rank: 'C',
        title: '不撓不屈の真理探究者',
        desc: `【解答${answerCount}回】何度間違えても諦めることなく、自力で正解へと辿り着いた不屈のチャレンジャー！`,
        color: 'bg-slate-600 text-white border-slate-400',
        stars: 1,
      };
    }

    // --- ANSWER MODAL ---
    function AnswerModal({ isOpen, onClose, secret, records, coinCount, onNewGame, onOpenGiveUp, answerAttempts = 0, onRecordAttempt }) {
      const [selectedCoin, setSelectedCoin] = useState(1);
      const [selectedType, setSelectedType] = useState('heavy'); // 'heavy' | 'light' | 'unknown'
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);
      const [solvedRank, setSolvedRank] = useState(null);
      const [submittedAttempt, setSubmittedAttempt] = useState(1);
      const [showRankList, setShowRankList] = useState(false);

      useEffect(() => {
        if (isOpen) {
          setIsSubmitted(false);
          setIsCorrect(false);
          setSolvedRank(null);
          setShowRankList(false);
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const coinIds = Array.from({ length: coinCount }, (_, i) => i + 1);
      const currentAttempt = answerAttempts + 1;

      const handleSubmit = () => {
        setSubmittedAttempt(currentAttempt);
        const correct = selectedCoin === secret.id && selectedType === secret.type;

        setIsCorrect(correct);
        setIsSubmitted(true);
        if (onRecordAttempt) onRecordAttempt(correct);

        if (correct) {
          const rank = calculatePlayerRank(currentAttempt, records.length, coinCount);
          setSolvedRank(rank);
          if (typeof confetti === 'function') {
            confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 } });
          }
        }
      };

      const isPerfectScore = isCorrect && records.length <= 3;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
          <div className={`relative w-full max-w-lg bg-white border-2 rounded-3xl p-5 sm:p-7 shadow-2xl flex flex-col gap-4 ${
            isSubmitted && isPerfectScore ? 'border-amber-400 bg-gradient-to-b from-amber-50 via-white to-amber-50' : 'border-amber-200'
          }`}>
            
            <div className="flex items-center justify-between border-b border-amber-100 pb-3">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-2xl bg-amber-100 border border-amber-300 flex items-center justify-center text-amber-700 shadow-xs">
                  <IconSparkles className="w-4 h-4" />
                </div>
                <h2 className="text-base sm:text-lg font-black text-slate-900">
                  {isSubmitted ? (isCorrect ? '判定結果' : '判定結果（不正解）') : `最終推理の解答 (${coinCount}枚モード)`}
                </h2>
              </div>
              <button onClick={onClose} className="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold text-xs">✕</button>
            </div>

            {!isSubmitted ? (
              <div className="flex flex-col gap-3">
                {/* Attempt count banner */}
                <div className="bg-gradient-to-r from-amber-500/10 via-yellow-500/15 to-orange-500/10 rounded-2xl p-2.5 border border-amber-300/80 flex items-center justify-between text-xs">
                  <div className="flex items-center gap-1.5 font-bold">
                    <span className="text-slate-700">現在の解答試行:</span>
                    <span className="px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 font-black font-mono shadow-xs">
                      第 {currentAttempt} 回目
                    </span>
                  </div>
                  <div className="flex items-center gap-1 font-mono font-bold text-slate-600 bg-white/80 px-2 py-0.5 rounded-lg border border-amber-200 text-[11px]">
                    <span>天秤計測:</span>
                    <span className={records.length <= 3 ? 'text-emerald-700 font-black' : 'text-slate-800'}>
                      {records.length}回
                    </span>
                  </div>
                </div>

                <div className="text-[11px] text-amber-950 font-bold bg-amber-100/50 p-2 rounded-xl border border-amber-200">
                  {currentAttempt === 1
                    ? '⭐ 解答1回（一発正解＆天秤3回以内）で最高称号【神域の論理神 (SSS)】！'
                    : currentAttempt === 2
                    ? '⭐ 2回目で正解すれば上位称号【S / A+】！'
                    : `⭐ 第${currentAttempt}回目での特定を目指しましょう！解答回数が少ないほど高ランクになります。`}
                </div>

                {/* Select 1 */}
                <div className="flex flex-col gap-1">
                  <label className="text-xs font-bold text-slate-800 flex justify-between">
                    <span>① どのコインが偽金ですか？</span>
                    <span className="font-mono text-amber-800 font-black bg-amber-100 px-2 rounded border border-amber-300">選択中: #{selectedCoin}</span>
                  </label>
                  <div className={`grid gap-1.5 ${coinCount === 9 ? 'grid-cols-9' : 'grid-cols-6'}`}>
                    {coinIds.map(id => (
                      <button
                        key={`ans-coin-${id}`}
                        onClick={() => setSelectedCoin(id)}
                        className={`py-2 rounded-xl font-mono font-black text-xs sm:text-sm border transition-all ${
                          selectedCoin === id
                            ? 'bg-gradient-to-br from-amber-400 to-yellow-500 text-slate-950 border-amber-300 ring-2 ring-amber-400 shadow-md scale-105'
                            : 'bg-amber-50/60 hover:bg-amber-100 text-slate-800 border-amber-200'
                        }`}
                      >
                        {id}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Select 2 */}
                <div className="flex flex-col gap-1">
                  <label className="text-xs font-bold text-slate-800">
                    ② 本物と比べてどうですか？
                  </label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => setSelectedType('heavy')}
                      className={`p-2.5 rounded-2xl border-2 flex flex-col items-center gap-0.5 transition-all ${
                        selectedType === 'heavy'
                          ? 'bg-rose-50 border-rose-500 text-rose-900 ring-2 ring-rose-300 shadow-md scale-[1.02]'
                          : 'bg-rose-50/40 border-rose-200 text-rose-800'
                      }`}
                    >
                      <span className="font-extrabold text-xs sm:text-sm">本物より【重い】</span>
                      <span className="text-[10px] text-rose-700 font-semibold">(Heavy)</span>
                    </button>
                    <button
                      onClick={() => setSelectedType('light')}
                      className={`p-2.5 rounded-2xl border-2 flex flex-col items-center gap-0.5 transition-all ${
                        selectedType === 'light'
                          ? 'bg-sky-50 border-sky-500 text-sky-900 ring-2 ring-sky-300 shadow-md scale-[1.02]'
                          : 'bg-sky-50/40 border-sky-200 text-sky-800'
                      }`}
                    >
                      <span className="font-extrabold text-xs sm:text-sm">本物より【軽い】</span>
                      <span className="text-[10px] text-sky-700 font-semibold">(Light)</span>
                    </button>
                  </div>
                </div>

                {/* Submit button */}
                <div className="flex items-center gap-2 pt-2">
                  <button
                    onClick={onClose}
                    className="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs sm:text-sm"
                  >
                    戻る
                  </button>
                  <button
                    onClick={handleSubmit}
                    className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 via-amber-500 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-black text-xs sm:text-sm shadow-md active:scale-95"
                  >
                    判定する（第{currentAttempt}回目）
                  </button>
                </div>

                {/* Give Up Link */}
                <div className="text-center pt-1 border-t border-amber-100">
                  <button
                    onClick={() => {
                      onClose();

            </div>

            {/* Action Buttons */}
            <div className="flex flex-col gap-2 pt-2 border-t border-amber-100">
              <button
                onClick={onStartGame}
                className="w-full py-3.5 sm:py-4 rounded-2xl bg-gradient-to-r from-amber-400 via-amber-500 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-black text-sm sm:text-base tracking-wide shadow-lg shadow-amber-500/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2"
              >
                <span>{hasActiveProgress ? '▶ ゲームを再開する' : `▶ ${coinCount}枚パズルに挑戦する（ゲーム開始）`}</span>
              </button>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
