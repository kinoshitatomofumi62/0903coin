    // --- COIN COMPONENT ---
    function CoinItem({ id, colorTag = 'default', onClick, onDragStart }) {
      const colorInfo = useMemo(() => {
        const found = COIN_COLOR_OPTIONS.find((c) => c.key === colorTag);
        return found || COIN_COLOR_OPTIONS[5];
      }, [colorTag]);

      return (
        <div
          draggable
          onDragStart={(e) => {
            e.dataTransfer.setData('text/plain', JSON.stringify({ coinId: id }));

          className={`

    // --- MAIN APP ---
    function App() {
      const [isOpeningOpen, setIsOpeningOpen] = useState(true);
      const [coinCount, setCoinCount] = useState(12); // 12 or 13
      const [secret, setSecret] = useState(() => generateRandomSecret(12));
      const [leftCoins, setLeftCoins] = useState([]);
      const [rightCoins, setRightCoins] = useState([]);
      const [currentOutcome, setCurrentOutcome] = useState('empty');
      const [records, setRecords] = useState([]);
      const [isWeighing, setIsWeighing] = useState(false);
      const [coinColors, setCoinColors] = useState({});
      const [activeBrush, setActiveBrush] = useState('real');
      
      // Modals
      const [answerAttempts, setAnswerAttempts] = useState(0);
      const [isAnswerOpen, setIsAnswerOpen] = useState(false);
      const [isGiveUpOpen, setIsGiveUpOpen] = useState(false);
      const [isRulesOpen, setIsRulesOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [isCopied, setIsCopied] = useState(false);

      const allCoinIds = useMemo(() => {
        return Array.from({ length: coinCount }, (_, i) => i + 1);
      }, [coinCount]);

      const benchCoins = allCoinIds.filter(id => !leftCoins.includes(id) && !rightCoins.includes(id));

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const handleNewGame = (newCount) => {
        const countToUse = newCount !== undefined ? newCount : coinCount;
        setSecret(generateRandomSecret(countToUse));
        setLeftCoins([]);
        setRightCoins([]);
        setCurrentOutcome('empty');
        setRecords([]);
        setCoinColors({});
        setIsWeighing(false);
        setAnswerAttempts(0);
        showToast(`新しい問題を設定しました！（${countToUse}枚モード）`);
      };

      const handleToggleCoinCount = (newCount) => {
        if (newCount === coinCount) return;
        setCoinCount(newCount);
        handleNewGame(newCount);
      };

      const handleRetrySame = () => {
        setLeftCoins([]);
        setRightCoins([]);
        setCurrentOutcome('empty');
        setRecords([]);
        setCoinColors({});
        setIsWeighing(false);
        setAnswerAttempts(0);
        showToast('同じ偽金設定のまま天秤をリセットしました。');
      };

      const handleMoveCoin = (id, target) => {
        setLeftCoins(prev => prev.filter(c => c !== id));
        setRightCoins(prev => prev.filter(c => c !== id));
        setCurrentOutcome('empty');

        if (target === 'left') {
          setLeftCoins(prev => {
            if (prev.length >= 6) {
              showToast('片方の皿には最大6枚までしか乗せられません');
              return prev;
            }
            return [...prev, id].sort((a, b) => a - b);
          });
        } else if (target === 'right') {
          setRightCoins(prev => {
            if (prev.length >= 6) {
              showToast('片方の皿には最大6枚までしか乗せられません');
              return prev;
            }
            return [...prev, id].sort((a, b) => a - b);
          });
        }
      };

      const handleWeigh = () => {
        if (leftCoins.length === 0 && rightCoins.length === 0) return;
        if (leftCoins.length !== rightCoins.length) {
          showToast('天秤で正確に測るため、左右の枚数を揃えてください');
          return;
        }

        setIsWeighing(true);
        setCurrentOutcome('empty');

        setTimeout(() => {
          let leftWeight = leftCoins.length * 10;
          let rightWeight = rightCoins.length * 10;

          if (leftCoins.includes(secret.id)) {
            leftWeight += (secret.type === 'heavy' ? 1 : -1);
          }
          if (rightCoins.includes(secret.id)) {
            rightWeight += (secret.type === 'heavy' ? 1 : -1);
          }

          let outcome = 'balanced';
          if (leftWeight > rightWeight) outcome = 'left_heavy';
          else if (rightWeight > leftWeight) outcome = 'right_heavy';

          setCurrentOutcome(outcome);
          setRecords(prev => [
            {
              step: prev.length + 1,
              leftCoins: [...leftCoins],
              rightCoins: [...rightCoins],
              outcome,
              timestamp: Date.now()
            },
            ...prev
          ]);
          setIsWeighing(false);
        }, 350);
      };

      // Tilt angle for scale
      const beamAngle = useMemo(() => {
        if (currentOutcome === 'left_heavy') return -9;
        if (currentOutcome === 'right_heavy') return 9;
        return 0;
      }, [currentOutcome]);

      const handleCopyHTML = async () => {
        try {
          const htmlContent = document.documentElement.outerHTML;
          await navigator.clipboard.writeText(htmlContent);
          setIsCopied(true);
          showToast('HTMLコードをクリップボードにコピーしました！GitHubにそのまま貼り付けできます。');
          setTimeout(() => setIsCopied(false), 3000);
        } catch (e) {
          showToast('コピーできませんでした。ブラウザの設定をご確認ください。');
        }
      };

      return (
        <div className="flex flex-col h-screen h-[100dvh] w-full max-w-7xl mx-auto p-2 sm:p-4 gap-2 sm:gap-3 overflow-hidden">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-xl border border-amber-400 flex items-center gap-2">

            <div

              </div>
              <div>
                <h1 className="text-sm sm:text-base font-black text-slate-900 flex items-center gap-1.5 group-hover:text-amber-900 transition-colors">
                  <span>✨ {coinCount}枚コインの偽金パズル</span>
                  <span className="text-[10px] bg-amber-100 text-amber-900 border border-amber-300 px-1.5 py-0.2 rounded font-mono font-bold">
                    3回目標
                  </span>
                </h1>
                <p className="text-[10px] sm:text-xs text-amber-800 font-medium">
                  天秤3回以内で偽金と軽重を特定せよ！ (クリックでルール表示)
                </p>
              </div>
            </div>

            <div className="flex items-center gap-1 sm:gap-2">
              {/* Version Switcher Pill */}
              <div className="flex items-center bg-amber-50 border border-amber-300 rounded-lg p-0.5 text-[10px] sm:text-xs font-bold">
                <button
                  type="button"
                  onClick={() => handleToggleCoinCount(9)}
                  className={`px-2 py-0.5 rounded transition-all ${
                    coinCount === 9
                      ? 'bg-amber-500 text-slate-950 shadow-xs'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                  title="9枚バージョン（基礎・入門）"
                >
                  9枚(基礎)
                </button>

    // --- TITLE & RANKING UTILITY ---
    function calculatePlayerRank(answerCount, weighingCount, coinCount = 12) {
      const isOptimalScale = weighingCount <= 3;
      if (answerCount <= 1) {
        if (isOptimalScale) {
          return {
            rank: 'SSS',
            title: coinCount === 9 ? '基礎マスター・論理の俊英' : '神域の論理神',
            desc: coinCount === 9
              ? '【解答1回＆天秤3回以内】誤答ゼロの一発正解！9枚基礎編を完璧に論理制覇した至高の称号！'
              : '【解答1回＆天秤3回以内】誤答ゼロの一発正解！完璧なる直観と数学論理を兼ね備えた至高の称号！',
            color: 'bg-amber-400 text-slate-950 border-amber-300',
            stars: 5,
          };
        } else if (weighingCount <= 5) {
          return {
            rank: 'SS',
            title: '一撃必中の一級鑑定士',
            desc: '【解答1回で一発正解】確実な計測の末、迷うことなく一度の解答で偽金の正体を射抜きました！',
            color: 'bg-purple-500 text-white border-purple-300',
            stars: 5,
          };
        } else {
          return {
            rank: 'S+',
            title: '百発百中の論理探偵',
            desc: '【解答1回で一発正解】データを盤石に揃え、一度のミスもなく1回目で確実に正解を特定！',
            color: 'bg-indigo-600 text-white border-indigo-400',
            stars: 4,
          };
        }
      }
      if (answerCount === 2) {
        if (isOptimalScale) {
          return {
            rank: 'S',
